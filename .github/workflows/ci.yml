name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      # Both ends of the range `engines.node` allows. The floor is 22, not 20:
      # Nuxt's build uses Set.prototype.difference, which only exists from Node 22,
      # so `nuxt build` dies on 20 even though the app itself runs there fine.
      matrix:
        node: [22, 24]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # `npm ci` needs the committed lockfile — that is the point, it installs the
      # exact versions production gets rather than re-resolving them.
      - run: npm ci

      # Runs against PGlite (Postgres compiled to WASM, in-process), so there is no
      # service container and no secrets to configure.
      - run: npm test

      # The other half of the contract: this is where Vue templates are compiled, so
      # a broken component fails here instead of in production.
      - run: npx nuxt build
        env:
          QRIS_STRING: '00020101021126001180002ID5802ID540520006304ABCD'
